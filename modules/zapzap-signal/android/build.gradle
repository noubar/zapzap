plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.noubar.zapzap'
version = '1.0.0'

android {
  namespace "com.noubar.zapzap.signal"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"

    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
        cppFlags "-std=c++17", "-O3"
      }
    }
  }

  buildFeatures {
    prefab true
  }

  externalNativeBuild {
    cmake {
      path file("src/main/cpp/CMakeLists.txt")
    }
  }
}

dependencies {
  implementation "com.google.oboe:oboe:1.11.0"
}
